name: Launcher build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest"]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
    - name: Build
      run: ./gradlew dist
    - working-directory: build/package
      run: zip -r Wanderer.zip Wanderer
      if: ${{ !startsWith(matrix.os, 'windows') }}
    - working-directory: build/package
      run: Compress-Archive Wanderer Wanderer.zip
      if: ${{ startsWith(matrix.os, 'windows') }}
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v6
      with:
        path: build/package/Wanderer.zip
        name: ${{ matrix.os == 'windows-latest' && 'Wanderer-win.zip' || 'Wanderer-linux.zip' }}
